[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.10",
]

[project]
name = "nneuroutil"
version = "2026.0"
description = "Utils for applying simple neural networks to neuroscience data"
readme = "README.rst"
keywords = [
    "dynamical-system",
    "eeg",
    "neural-network",
]
license = "MIT"
maintainers = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
authors = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "array-api-compat>=1.11",
    "numpy>=2.1",
    "rich>=10",
    "scipy>=1.14",
    "typing-extensions>=4.10",
]
# NOTE: this is just here because readthedocs does not know how to read dependency-groups
optional-dependencies.docs = [
    "sphinx>=6",
    "sphinx-book-theme",
]
urls.Repository = "https://github.com/alexfikl/nneuroutil"

[dependency-groups]
dev = [ "pyproject-fmt", "reuse", "typos", "uv" ]
test = [ "pytest", "pytest-github-actions-annotate-failures", "ruff", "scipy-stubs", "ty" ]
docs = [ "sphinx>=6", "sphinx-book-theme" ]
jax = [ "flax>=0.10", "jax>=0.7" ]
torch = [ "pytorch>=2" ]
visualization = [ "matplotlib", "scienceplots" ]

[tool.ruff]
target-version = "py311"
line-length = 88
preview = true
lint.select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # flake8
    "F",   # flake8
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "NPY", # numpy
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # ruff
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # flake8
]
lint.ignore = [
    "assert",
    "exec-builtin",
    "import-outside-top-level",
    "invalid-argument-name",
    "magic-value-comparison",
    "mixed-case-variable-in-class-scope",
    "module-import-not-at-top-of-file",
    "non-augmented-assignment",
    "non-empty-init-module",
    "non-lowercase-variable-in-function",
    "quoted-annotation",
    "single-line-implicit-string-concatenation",
    "stdlib-module-shadowing",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "double"
lint.flake8-quotes.multiline-quotes = "double"
lint.isort.known-first-party = [
    "nneuroutil",
]
lint.isort.required-imports = [
    "from __future__ import annotations",
]

[tool.typos]
default.extend-ignore-re = [ "(?Rm)^.*#\\s*spell:\\s*disable$" ]
default.extend-words.inh = "inh"
default.extend-words.ND = "ND"

[tool.ty]
analysis.replace-imports-with-any = [ "torch.**" ]

[tool.pytest]
ini_options.testpaths = "tests"
ini_options.addopts = [
    "-rswx",
    "--durations=25",
    "--capture=no",
    "--verbose",
]
